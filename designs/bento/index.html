<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efece6">
<title>Daniel Husanu – Design: Bento</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efece6; --tile: #fbfaf7; --tile-2: #f4f1ec; --text: #18181b; --muted: #6d6a66; --line: rgba(24, 24, 27, .08);
  --accent: #ea580c; --accent-soft: #fdeadf; --ink: #18181b; --ink-text: #f6f4f0;
  --r: 28px; --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); }

/* top */
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 18px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--ink-text); display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; }
.top nav { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); font-weight: 600; font-size: 14px; cursor: pointer; color: var(--text); font-family: inherit; transition: transform .3s var(--ease), background .2s; }
.pill:hover { transform: translateY(-1px); }
.pill.dark { background: var(--ink); color: var(--ink-text); border-color: transparent; }
.pill.accent { background: var(--accent); color: #fff; border-color: transparent; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: dense; gap: 14px; }
.t { background: var(--tile); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; position: relative; overflow: hidden; min-width: 0; }
.s2 { grid-column: span 2; } .s4 { grid-column: span 4; } .r2 { grid-row: span 2; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
.label b { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
[data-reveal] { opacity: 0; transform: translateY(18px) scale(.985); }
[data-reveal].in { opacity: 1; transform: none; transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: calc(var(--i, 0) * 60ms); }
a.t, .t.click { cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
a.t:hover, .t.click:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -22px rgba(24, 24, 27, .35); }
.go { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%; background: var(--tile-2); display: grid; place-items: center; transition: transform .35s var(--ease); }
a.t:hover .go, .t.click:hover .go { transform: rotate(45deg); }

/* profile */
.profile { display: flex; flex-direction: column; justify-content: space-between; gap: 22px; }
.status { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #e9f5e1; color: #3f6d22; font-size: 13px; font-weight: 600; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #4f8a2a; box-shadow: 0 0 0 3px rgba(79, 138, 42, .2); }
.profile h1 { margin: 0; font-size: clamp(38px, 6vw, 60px); line-height: 1; letter-spacing: -.04em; font-weight: 800; }
.profile h1 span { color: var(--muted); font-weight: 500; }
.profile .role { margin: 10px 0 0; font-size: 17px; font-weight: 600; }
.profile p.tag { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.photo { padding: 0; min-height: 300px; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .loc { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(251, 250, 247, .85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; font-weight: 600; }
.photo .loc svg { width: 15px; height: 15px; color: var(--accent); }

.stat strong { display: block; font-size: 52px; line-height: 1; letter-spacing: -.04em; font-weight: 800; }
.stat span { color: var(--muted); font-weight: 500; }
.stat { display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; }

.now .co { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.lg { width: 46px; height: 46px; border-radius: 13px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; position: relative; }
.lg img { width: 70%; height: 70%; object-fit: contain; position: relative; z-index: 1; }
.lg em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; background: var(--ink); color: var(--ink-text); }
.now h3 { margin: 0; font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
.now .co b { display: block; font-size: 15px; } .now .co small { color: var(--muted); font-size: 13px; }
.now { display: flex; flex-direction: column; gap: 14px; }

.about p { margin: 0 0 12px; color: var(--muted); }
.about p:first-child { color: var(--text); font-size: 21px; line-height: 1.35; letter-spacing: -.015em; font-weight: 600; }

.proj { padding: 0; display: flex; flex-direction: column; }
.proj .img { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #2b2b30, #18181b); position: relative; overflow: hidden; }
.proj .img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform 1s var(--ease); }
.proj:hover .img img { transform: scale(1.04); }
.proj .img .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(246, 244, 240, .9); font-size: 64px; font-weight: 800; letter-spacing: -.04em; }
.proj .body { padding: 18px 20px 20px; }
.proj h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.02em; }
.proj p { margin: 0; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tags span { padding: 4px 10px; border-radius: 999px; background: var(--tile-2); font-size: 12.5px; font-weight: 600; }
.proj .go { background: rgba(251, 250, 247, .9); z-index: 2; }

.xp ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.xp li { display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.xp li:first-child { border-top: 0; padding-top: 0; }
.xp h4 { margin: 0; font-size: 15.5px; letter-spacing: -.01em; }
.xp .meta { color: var(--muted); font-size: 13.5px; }
.xp ul { margin: 8px 0 0; padding-left: 16px; color: var(--muted); font-size: 14px; }
.xp ul li { display: list-item; border: 0; padding: 2px 0; }

.skills .grp + .grp { margin-top: 14px; }
.skills h5 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { padding: 6px 11px; border-radius: 10px; background: var(--tile-2); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; }

.social { display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; color: #fff; border: 0; }
.social svg { width: 30px; height: 30px; }
.social b { font-size: 18px; letter-spacing: -.01em; }
.social small { display: block; opacity: .8; font-size: 13px; }
.ig { background: radial-gradient(circle at 20% 110%, #fdd26a 0%, #f77737 28%, #e1306c 58%, #833ab4 100%); }
.li { background: #0a66c2; }
.social .go { background: rgba(255, 255, 255, .2); color: #fff; }

.contact { background: var(--ink); color: var(--ink-text); border: 0; }
.contact .label { color: #a8a5a0; }
.contact h2 { margin: 0 0 18px; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; letter-spacing: -.035em; }
.contact .rows { display: grid; gap: 8px; }
.contact .rows a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, .06); font-weight: 500; transition: background .2s; overflow-wrap: anywhere; }
.contact .rows a:hover { background: rgba(255, 255, 255, .12); }
.contact .rows svg { color: var(--accent); }
.contact .rows a span { margin-left: auto; opacity: .5; }

.foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; padding: 20px 4px 0; }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .s4 { grid-column: span 2; }
  .t { padding: 18px; border-radius: 24px; }
  .photo { min-height: 240px; }
  .stat strong { font-size: 42px; }
  .stat, .social { min-height: 128px; }
  .top nav .pill:not(.dark) { display: none; }
}
@media (max-width: 560px) {
  .s2 { grid-column: span 2; }
  .profile { order: -2; } .photo { order: -1; grid-row: span 1; min-height: 340px; }
  .proj .img { aspect-ratio: 4 / 3; }
}

.sheet-bg { position: fixed; inset: 0; background: rgba(24, 24, 27, .4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 50; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 90svh; overflow: auto; background: var(--tile); border-radius: 28px 28px 0 0; transform: translateY(105%); transition: transform .5s cubic-bezier(.2, .9, .25, 1); padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); }
.sheet.on { transform: none; } .sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet .bar { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 14px; background: #d6d3ce; }
.sheet .x { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--tile-2); display: grid; place-items: center; cursor: pointer; }
.sheet .gal { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
.sheet .gal img { flex: 0 0 86%; max-height: 55svh; object-fit: cover; object-position: top; border-radius: 18px; scroll-snap-align: center; border: 1px solid var(--line); }
.sheet .gal img:only-child { flex-basis: 100%; }
.sheet h3 { font-size: 26px; letter-spacing: -.03em; margin: 18px 0 8px; }
.sheet p { color: var(--muted); }
@media (min-width: 761px) { .sheet { left: 50%; width: 720px; bottom: 20px; border-radius: 28px; transform: translate(-50%, 110%); } .sheet.on { transform: translate(-50%, 0); } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--ink-text); padding: 10px 16px; border-radius: 999px; font-weight: 600; transition: .3s; z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } [data-reveal] { opacity: 1; transform: none; } }

.stats { display: flex; flex-direction: column; gap: 4px; }
.stats div { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.stats div:first-of-type { border-top: 0; padding-top: 0; }
.stats strong { font-size: 34px; line-height: 1; letter-spacing: -.04em; font-weight: 800; min-width: 34px; }
.stats span { color: var(--muted); font-size: 13.5px; font-weight: 500; line-height: 1.3; }
.contact .rows { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .contact .rows { grid-template-columns: 1fr; } }
.proj .img img { position: relative; z-index: 1; }
.sheet { visibility: hidden; transition: transform .5s cubic-bezier(.2, .9, .25, 1), visibility 0s .5s; }
.sheet.on { visibility: visible; transition: transform .5s cubic-bezier(.2, .9, .25, 1); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#"><i id="mono"></i><span id="brand"></span></a>
    <nav><a class="pill" href="#proiecte">Proiecte</a><a class="pill" href="#experienta">Experiență</a><a class="pill dark" href="#contact">Contact</a></nav>
  </header>
  <main class="grid" id="grid"></main>
  <footer class="foot"><span id="copy"></span><span>Design: Bento</span></footer>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="bar"></div><button class="x" id="sheetX" aria-label="Închide"></button><div id="sheetBody"></div></section>
<script src="../shared.js"></script>
<script>
(function () {
  var C = CV, I = C.I, e = C.esc;
  C.load().then(function (c) {
    var p = c.profile || {}, parts = String(p.name || "").split(" ");
    document.getElementById("brand").textContent = p.name || "";
    document.getElementById("mono").textContent = C.initials(p.name);
    document.getElementById("copy").textContent = "© " + new Date().getFullYear() + " " + (p.name || "");
    var tel = C.tel(p), wa = C.wa(p), html = [];

    html.push('<section class="t s2 r2 profile" data-reveal>' +
      '<div>' + (p.availability ? '<span class="status"><i></i>' + e(p.availability) + '</span>' : "") + '</div>' +
      '<div><h1>' + e(parts[0]) + ' <span>' + e(parts.slice(1).join(" ")) + '</span></h1>' +
      '<p class="role">' + e(p.title) + '</p><p class="tag">' + e(p.tagline) + '</p></div>' +
      '<div class="actions">' +
        (p.email ? '<a class="pill accent" href="mailto:' + e(p.email) + '">' + I.mail + 'Scrie-mi</a>' : "") +
        (tel ? '<a class="pill" href="tel:' + e(tel) + '">' + I.phone + 'Sună</a>' : "") +
        '<button class="pill" id="share">' + I.share + 'Distribuie</button>' +
        '<button class="pill" id="vcf">' + I.contact + 'Salvează</button>' +
      '</div></section>');

    html.push('<section class="t r2 photo" data-reveal><img src="' + e(C.asset(p.photo)) + '" alt="' + e(p.name) + '">' +
      (p.location ? '<span class="loc">' + I.pin + e(p.location) + '</span>' : "") + '</section>');

    var now = C.list(c.experience)[0];
    if (now) html.push('<section class="t now" data-reveal><p class="label"><b></b>Acum</p><h3>' + e(now.role) + '</h3>' +
      '<div class="co"><span class="lg"><img src="' + e(C.logo(now)) + '" alt="" onerror="this.remove()"><em>' + e(C.initials(now.company)) + '</em></span>' +
      '<div><b>' + e(now.company) + '</b><small>' + e(now.period) + '</small></div></div></section>');

    var st = C.list(c.stats);
    if (st.length) html.push('<section class="t stats" data-reveal><p class="label"><b></b>În cifre</p>' + st.map(function (s) {
      return '<div><strong>' + e(s.value) + '</strong><span>' + e(s.label) + '</span></div>';
    }).join("") + '</section>');

    if (c.about) html.push('<section class="t s2 about" id="despre" data-reveal><p class="label"><b></b>Despre</p>' + C.paragraphs(c.about) + '</section>');
    C.list(c.social).forEach(function (s) {
      var ig = /instagram/i.test(s.url + s.label), cls = ig ? "ig" : /linkedin/i.test(s.url + s.label) ? "li" : "li";
      var handle = (String(s.url).match(/instagram\.com\/([^/?#]+)/i) || [])[1];
      html.push('<a class="t social ' + cls + '" data-reveal href="' + e(C.safeUrl(s.url)) + '" target="_blank" rel="noopener"><span class="go">' + I.arrow + '</span>' +
        C.socialIcon(s) + '<div><b>' + e(s.label) + '</b><small>' + (handle ? "@" + e(handle) : "Profil") + '</small></div></a>');
    });

    C.list(c.projects).forEach(function (pr, i) {
      var img = C.cover(pr);
      html.push('<section class="t s2 proj click" data-reveal data-p="' + i + '"' + (i === 0 ? ' id="proiecte"' : "") + '><span class="go">' + I.arrow + '</span>' +
        '<div class="img"><span class="ph">' + e(C.initials(pr.title)) + '</span>' + (img ? '<img src="' + e(img) + '" alt="" loading="lazy" onerror="this.remove()">' : "") + '</div>' +
        '<div class="body"><h3>' + e(pr.title) + '</h3><p>' + e(pr.description) + '</p><div class="tags">' +
        C.list(pr.tags).map(function (t) { return "<span>" + e(t) + "</span>"; }).join("") + '</div></div></section>');
    });

    var xp = C.list(c.experience).concat(C.list(c.education).map(function (ed) { return { role: ed.title, company: ed.institution, period: ed.period, domain: ed.domain, logo: ed.logo, edu: 1 }; }));
    html.push('<section class="t s2 xp" id="experienta" data-reveal><p class="label"><b></b>Experiență & educație</p><ol>' + xp.map(function (x) {
      var d = C.lines(x.description);
      return '<li><span class="lg"><img src="' + e(C.logo(x)) + '" alt="" onerror="this.remove()"><em>' + e(C.initials(x.company)) + '</em></span><div>' +
        '<h4>' + e(x.role) + '</h4><div class="meta">' + e(x.company) + ' · ' + e(x.period) + '</div>' +
        (d.length ? '<ul>' + d.map(function (l) { return "<li>" + e(l) + "</li>"; }).join("") + '</ul>' : "") + '</div></li>';
    }).join("") + '</ol></section>');

    html.push('<section class="t s2 skills" data-reveal><p class="label"><b></b>Competențe</p>' + C.list(c.skills).map(function (g) {
      return '<div class="grp"><h5>' + e(g.group) + '</h5><div class="chips">' + C.list(g.items).map(function (s) { return "<span>" + e(s) + "</span>"; }).join("") + '</div></div>';
    }).join("") + '</section>');


    html.push('<section class="t s4 contact" id="contact" data-reveal><p class="label">Contact</p><h2>Hai să ținem legătura.</h2><div class="rows">' +
      (p.email ? '<a href="mailto:' + e(p.email) + '">' + I.mail + e(p.email) + '<span>' + I.right + '</span></a>' : "") +
      (tel ? '<a href="tel:' + e(tel) + '">' + I.phone + e(p.phone) + '<span>' + I.right + '</span></a>' : "") +
      (wa ? '<a href="https://wa.me/' + e(wa) + '" target="_blank" rel="noopener">' + I.whatsapp + 'WhatsApp<span>' + I.right + '</span></a>' : "") +
      '</div></section>');

    var grid = document.getElementById("grid");
    grid.innerHTML = html.join("");
    C.reveal(grid);
    document.getElementById("share").onclick = function () { C.share(p); };
    document.getElementById("vcf").onclick = function () { C.vcard(p); C.toast("Contact descărcat ✓"); };

    // project sheet
    var sheet = document.getElementById("sheet"), bg = document.getElementById("sheetBg"), body = document.getElementById("sheetBody");
    document.getElementById("sheetX").innerHTML = I.close;
    function close() { sheet.classList.remove("on"); bg.classList.remove("on"); }
    bg.onclick = close; document.getElementById("sheetX").onclick = close;
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") close(); });
    grid.addEventListener("click", function (ev) {
      var t = ev.target.closest("[data-p]"); if (!t) return;
      var pr = c.projects[+t.getAttribute("data-p")];
      var imgs = [C.asset(pr.image)].concat(C.list(pr.gallery).map(C.asset)).filter(Boolean);
      if (!imgs.length && C.shot(pr.link)) imgs.push(C.shot(pr.link));
      body.innerHTML = (imgs.length ? '<div class="gal">' + imgs.map(function (s) { return '<img src="' + e(s) + '" alt="" onerror="this.remove()">'; }).join("") + '</div>' : "") +
        '<h3>' + e(pr.title) + '</h3><div class="tags">' + C.list(pr.tags).map(function (x) { return "<span>" + e(x) + "</span>"; }).join("") + '</div>' +
        C.paragraphs(pr.details || pr.description) +
        (pr.link ? '<a class="pill accent" href="' + e(C.safeUrl(pr.link)) + '" target="_blank" rel="noopener">Deschide site-ul ' + I.arrow + '</a>' : "");
      sheet.scrollTop = 0; sheet.classList.add("on"); bg.classList.add("on");
    });
  });
})();
</script>
</body>
</html>
