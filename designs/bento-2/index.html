<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe9e1">
<title>Daniel Husanu – Bento 2 · Poza în prim-plan</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../glass.css">
<style>
.hero { display: grid; grid-template-columns: 1.75fr 1fr; gap: 14px; align-items: stretch; }
/* the photo carries a frosted profile card */
.photo.big { min-height: 600px; display: flex; align-items: flex-end; padding: 14px; }
.photo.big .loc { position: absolute; top: 16px; left: 16px; bottom: auto; }
.photo.big .profile { width: 100%; max-width: 560px; padding: 22px; border-radius: 26px;
  background: linear-gradient(140deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .5)); }
.photo.big .profile .tag { color: #4d4741; }
.photo.big .profile h1 { font-size: clamp(34px, 5vw, 52px); }
.side { display: grid; gap: 14px; grid-template-rows: auto auto 1fr; }
.statsrow { display: grid; grid-template-columns: repeat(3, 1fr); padding: 20px 8px; }
.statsrow .num { text-align: center; padding: 0 6px; }
.statsrow .num + .num { border-left: 1px solid rgba(255, 255, 255, .7); }
.statsrow .num strong { font-size: 40px; }
.statsrow .num span { font-size: 12px; }
.socs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.soc { min-height: 140px; }
.now { justify-content: center; }

.row-head { display: flex; align-items: end; justify-content: space-between; margin: 34px 6px 12px; }
.row-head h2 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
.row-head .ctrl { display: flex; gap: 6px; }
.row-head .ctrl button { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; }
.car { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 14px 18px; margin: 0 -14px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car .proj { flex: 0 0 min(82%, 420px); scroll-snap-align: center; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; margin-top: 14px; }
.xp, .contact { margin-top: 14px; }
.contact .rows { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 10px; }
  .photo.big { min-height: 78svh; padding: 10px; }
  .photo.big .profile { padding: 18px; }
  .side { gap: 10px; }
  .socs { gap: 10px; }
  .soc { min-height: 116px; padding: 16px; }
  .statsrow .num strong { font-size: 34px; }
  .two { grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  .xp, .contact { margin-top: 10px; }
  .contact .rows { grid-template-columns: 1fr; }
  .t { padding: 18px; } :root { --r: 26px; }
  .row-head .ctrl { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../shared.js"></script>
<script src="../glass.js"></script>
<script>
CV.load().then(function (c) {
  var t = GLASS.tiles(c), root = document.getElementById("root"), p = c.profile || {};
  var loc = p.location ? '<span class="pillglass loc">' + CV.I.pin + CV.esc(p.location) + '</span>' : "";
  root.innerHTML = t.bar() +
    '<section class="hero">' + t.photo("big", loc + t.profile()) +
      '<div class="side">' + t.now() + t.statsRow() + '<div class="socs">' + t.socials() + '</div></div></section>' +
    '<div class="row-head" id="proiecte"><h2>Proiecte</h2><div class="ctrl"><button class="btn" data-dir="-1" aria-label="Înapoi">‹</button><button class="btn" data-dir="1" aria-label="Înainte">›</button></div></div>' +
    '<div class="car" id="car">' + t.projects() + '</div>' +
    '<div class="two">' + t.about() + t.skills() + '</div>' + t.xp() + t.contact() + t.foot("Bento 2 · Poza în prim-plan");
  var car = document.getElementById("car");
  root.querySelectorAll("[data-dir]").forEach(function (b) {
    b.onclick = function () { car.scrollBy({ left: +b.getAttribute("data-dir") * car.clientWidth * .8, behavior: "smooth" }); };
  });
  GLASS.wire(root, c);
});
</script>
</body>
</html>
