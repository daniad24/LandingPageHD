<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daniel Husanu – CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* A4 print template for the downloadable CV (?lang=ro|en). Rendered to PDF by tools/build-cv.js */
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9e4de; }
body { font: 9.2pt/1.48 "Inter", "Helvetica Neue", Arial, sans-serif; color: #1a1714; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 210mm; height: 297mm; margin: 0 auto; background: #fff; display: grid; grid-template-columns: 66mm 1fr; overflow: hidden; }
@media screen { .page { margin: 24px auto; box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .3); } }
aside { background: linear-gradient(170deg, #fbf3ea, #f3e8dc); padding: 14mm 8mm 10mm 10mm; }
main { padding: 14mm 13mm 10mm 11mm; }
.photo { width: 34mm; height: 34mm; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1.4mm #fff, 0 4mm 9mm -4mm rgba(234, 88, 12, .5); margin-bottom: 8mm; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
h1 { margin: 0; font-size: 27pt; line-height: 1; letter-spacing: -.04em; font-weight: 800; }
h1 span { color: #8a8178; font-weight: 500; }
.role { margin: 2.2mm 0 0; font-size: 11.5pt; font-weight: 600; color: #ea580c; }
.tag { margin: 3mm 0 0; color: #5d564f; font-size: 9.8pt; max-width: 120mm; }
h2 { margin: 6.5mm 0 3mm; font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: #8a8178; font-weight: 700; display: flex; align-items: center; gap: 2.4mm; }
h2::before { content: ""; width: 1.6mm; height: 1.6mm; border-radius: 50%; background: #ea580c; box-shadow: 0 0 0 .8mm rgba(234, 88, 12, .18); }
h2::after { content: ""; flex: 1; height: .25mm; background: #eadfd4; }
aside h2 { margin-top: 0; }
aside h2::after { background: #e6d6c6; }
aside section + section h2 { margin-top: 7mm; }
.ct { list-style: none; margin: 0; padding: 0; display: grid; gap: 2.4mm; font-size: 8.8pt; }
.ct li { display: flex; gap: 2.4mm; align-items: flex-start; word-break: break-word; }
.ct svg { flex: 0 0 3.6mm; width: 3.6mm; height: 3.6mm; fill: #ea580c; margin-top: .5mm; }
.ct a { color: inherit; text-decoration: none; }
.sk h3 { margin: 0 0 1.6mm; font-size: 8.8pt; font-weight: 700; }
.sk + .sk { margin-top: 4mm; }
.chips { display: flex; flex-wrap: wrap; gap: 1.4mm; }
.chips span { padding: .8mm 2.4mm; border-radius: 9mm; background: #fff; font-size: 8pt; font-weight: 500; box-shadow: inset 0 0 0 .25mm #ead9c8; }
.edu b { display: block; font-size: 9pt; line-height: 1.35; }
.edu small { display: block; color: #6f6861; font-size: 8.4pt; margin-top: .8mm; }
.about p { margin: 0 0 2.4mm; color: #3b3530; }
.job { position: relative; padding-left: 5mm; break-inside: avoid; }
.job + .job { margin-top: 4.6mm; }
.job::before { content: ""; position: absolute; left: 0; top: 1.6mm; bottom: -3.2mm; width: .3mm; background: #eadfd4; }
.job:last-child::before { bottom: 0; }
.job::after { content: ""; position: absolute; left: -.95mm; top: 1.2mm; width: 2.2mm; height: 2.2mm; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 .6mm #ea580c; }
.job .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
.job h4 { margin: 0; font-size: 10.4pt; line-height: 1.3; letter-spacing: -.01em; }
.job .when { flex: none; font-size: 8.4pt; font-weight: 600; color: #ea580c; }
.job .co { color: #6f6861; font-weight: 600; font-size: 8.8pt; margin-top: .4mm; }
.job ul { margin: 1.6mm 0 0; padding-left: 3.8mm; color: #3b3530; }
.job li { margin: .5mm 0; }
.job li::marker { color: #ea580c; }
.pr { display: grid; grid-template-columns: 1fr 1fr; gap: 3.4mm; }
.pr div { padding: 3.2mm 3.6mm; border-radius: 3mm; background: #faf6f1; box-shadow: inset 0 0 0 .25mm #efe4d8; }
.pr b { font-size: 9.8pt; }
.pr a { display: block; color: #ea580c; text-decoration: none; font-size: 8pt; font-weight: 600; margin: .4mm 0 1.2mm; }
.pr p { margin: 0; color: #4b443e; font-size: 8.6pt; line-height: 1.45; }
.foot { margin-top: 6mm; font-size: 7.6pt; color: #9a9189; }
</style>
</head>
<body>
<div class="page" id="cv"></div>
<script src="../../site/shared.js"></script>
<script>
(function () {
  var C = CV, e = C.esc, I = C.I;
  var lang = (location.search.match(/[?&]lang=(ro|en)\b/) || [])[1] || "ro";
  var T = {
    ro: { contact: "Contact", skills: "Competențe", edu: "Educație", about: "Profil", xp: "Experiență", projects: "Proiecte", site: "Portofoliu online" },
    en: { contact: "Contact", skills: "Skills", edu: "Education", about: "Profile", xp: "Experience", projects: "Projects", site: "Online portfolio" }
  }[lang];
  document.documentElement.lang = lang;
  function host(u) { return String(u || "").replace(/^https?:\/\//, "").replace(/\/$/, ""); }
  C.loadBoth().then(function (r) {
    var c = C.visible(lang === "en" ? C.merge(r[0], r[1]) : r[0]), p = c.profile || {}, parts = String(p.name || "").split(" ");
    // only social links that point to an actual profile (not a bare domain)
    var li = C.list(c.social).filter(function (s) { return /linkedin\.com\/in\//i.test(s.url); })[0];
    var about = String(c.about || "").split(/\n\s*\n/).filter(Boolean);
    if (about.length > 2) about = about.slice(1); // the first paragraph is a one-line hook, the CV starts with the tagline instead
    document.getElementById("cv").innerHTML =
      '<aside>' +
        (p.photo ? '<div class="photo"><img src="' + e(C.asset(p.photo)) + '" alt=""></div>' : "") +
        '<section><h2>' + T.contact + '</h2><ul class="ct">' +
          (p.email ? '<li>' + I.mail + '<a href="mailto:' + e(p.email) + '">' + e(p.email) + '</a></li>' : "") +
          (p.phone ? '<li>' + I.phone + '<a href="tel:' + e(C.tel(p)) + '">' + e(p.phone) + '</a></li>' : "") +
          (p.location ? '<li>' + I.pin + e(p.location) + '</li>' : "") +
          (p.website ? '<li>' + I.globe + '<a href="' + e(C.safeUrl(p.website)) + '">' + e(host(p.website)) + '</a></li>' : "") +
          (li ? '<li>' + I.linkedin + '<a href="' + e(C.safeUrl(li.url)) + '">' + e(host(li.url).replace(/^www\./, "")) + '</a></li>' : "") +
        '</ul></section>' +
        '<section><h2>' + T.edu + '</h2>' + C.list(c.education).map(function (d) {
          return '<div class="edu"><b>' + e(d.title) + '</b><small>' + e(d.institution) + '<br>' + e(d.period) + '</small></div>';
        }).join("") + '</section>' +
        '<section><h2>' + T.skills + '</h2>' + C.list(c.skills).map(function (g) {
          return '<div class="sk"><h3>' + e(g.group) + '</h3><div class="chips">' + C.list(g.items).map(function (s) { return '<span>' + e(s) + '</span>'; }).join("") + '</div></div>';
        }).join("") + '</section>' +
      '</aside>' +
      '<main>' +
        '<h1>' + e(parts[0]) + ' <span>' + e(parts.slice(1).join(" ")) + '</span></h1>' +
        '<p class="role">' + e(p.title) + '</p><p class="tag">' + e(p.tagline) + '</p>' +
        '<h2>' + T.about + '</h2><div class="about">' + about.map(function (x) { return '<p>' + e(x) + '</p>'; }).join("") + '</div>' +
        '<h2>' + T.xp + '</h2>' + C.list(c.experience).map(function (x) {
          var d = C.lines(x.description);
          return '<div class="job"><div class="hd"><h4>' + e(x.role) + '</h4><span class="when">' + e(x.period) + '</span></div><div class="co">' + e(x.company) + '</div>' +
            (d.length ? '<ul>' + d.map(function (l) { return '<li>' + e(l) + '</li>'; }).join("") + '</ul>' : "") + '</div>';
        }).join("") +
        (C.list(c.projects).length ? '<h2>' + T.projects + '</h2><div class="pr" style="grid-template-columns:repeat(' + Math.min(3, C.list(c.projects).length) + ',1fr)">' + C.list(c.projects).map(function (x) {
          return '<div><b>' + e(x.title) + '</b>' + (x.link ? '<a href="' + e(C.safeUrl(x.link)) + '">' + e(host(x.link)) + '</a>' : "") + '<p>' + e(x.description) + '</p></div>';
        }).join("") + '</div>' : "") +
        (p.website ? '<p class="foot">' + T.site + ': ' + e(host(p.website)) + '</p>' : "") +
      '</main>';
    var imgs = [].slice.call(document.images);
    Promise.all(imgs.map(function (im) { return im.complete ? 0 : new Promise(function (ok) { im.onload = im.onerror = ok; }); }))
      .then(function () { return document.fonts ? document.fonts.ready : 0; })
      .then(function () { window.cvReady = true; });
  });
})();
</script>
</body>
</html>
