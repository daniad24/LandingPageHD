<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe9e1">
<title>Daniel Husanu – Bento 3 · Widget-uri</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../glass.css">
<style>
/* square widget grid: 4 cells across on phones, 6 on desktop */
:root { --gap: 10px; --cols: 4; --cell: calc((min(100vw, 1120px) - 28px - (var(--cols) - 1) * var(--gap)) / var(--cols)); }
@media (min-width: 901px) { :root { --cols: 6; --gap: 14px; } }
.widgets { display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: var(--cell); gap: var(--gap); margin-top: var(--gap); grid-auto-flow: dense; }
.w2x2 { grid-column: span 2; grid-row: span 2; }
.w2x1 { grid-column: span 2; }
.photo { min-height: 0; }
.profile { padding: 24px; }

.now.mini { padding: 12px 14px; }
.now.mini { justify-content: center; }
.now.mini .label { display: none; }
.now.mini .co small::before { content: "Acum · "; color: var(--accent); font-weight: 700; }
.now.mini h3 { display: none; }
.now.mini .co { gap: 10px; }
.now.mini .lg { width: 38px; height: 38px; border-radius: 11px; }
.now.mini .co b { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.now.mini .co small { font-size: 11.5px; white-space: nowrap; display: block; }
.now.mini .co b { -webkit-line-clamp: 1 !important; }
.photo .loc { max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; padding: 7px 11px; display: inline-block; }
.photo .loc svg { vertical-align: -3px; margin-right: 4px; }

.num { padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.num strong { font-size: clamp(30px, calc(var(--cell) * .38), 54px); }
.num span { font-size: 11.5px; margin: 0; }

.soc { padding: 14px; gap: 6px; }
.soc .go { display: none; }
.soc svg { width: 26px; height: 26px; }
.soc b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon b { white-space: nowrap; }
.soc small { display: none; }
.icon { display: flex; flex-direction: column; justify-content: space-between; padding: 14px; border: 0; font: inherit; color: var(--text); text-align: left; }
.icon svg { width: 24px; height: 24px; }
.icon b { font-size: 13px; }

.lower { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
.lower .proj, .lower .about, .lower .skills { grid-column: span 1; }
.lower .xp, .lower .contact { grid-column: 1 / -1; }
.contact .rows { grid-template-columns: repeat(3, 1fr); }
.sec-title { grid-column: 1 / -1; margin: 18px 6px 0; font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* floating liquid-glass dock */
.dock { position: fixed; z-index: 40; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 30px; }
.dock a, .dock button { width: 66px; height: 56px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10.5px "Inter", sans-serif; color: var(--text); background: none; border: 0; cursor: pointer; transition: transform .4s var(--spring), background .2s; }
.dock a:active, .dock button:active { transform: scale(.88); }
.dock .main { background: linear-gradient(135deg, var(--accent), #f97316); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 8px 18px -8px rgba(234, 88, 12, .8); }
.dock svg { width: 21px; height: 21px; }
.wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

@media (max-width: 420px) { .soc { align-items: center; justify-content: center; } .soc b { display: none; } .soc svg { width: 34px !important; height: 34px !important; } .soc b, .icon b { font-size: 10.5px; letter-spacing: -.02em; } .soc, .icon { padding: 10px 9px; } .num span { font-size: 10.5px; } .soc svg, .icon svg { width: 24px; height: 24px; } }
@media (max-width: 900px) {
  .lower { grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  .contact .rows { grid-template-columns: 1fr; }
  .t { padding: 18px; } :root { --r: 24px; }
  .profile { padding: 20px; }
  .profile .acts .btn[data-act] { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../shared.js"></script>
<script src="../glass.js"></script>
<script>
CV.load().then(function (c) {
  var t = GLASS.tiles(c), root = document.getElementById("root"), I = CV.I, p = c.profile || {}, tel = CV.tel(p), wa = CV.wa(p);
  var share = '<button class="glass icon press" data-in data-act="share">' + I.share + '<b>Distribuie</b></button>';
  root.innerHTML = t.bar() + t.profile() +
    '<section class="widgets">' + t.photo("w2x2") + t.now("w2x1 mini") + t.stat(0) + t.stat(1) + t.stat(2) + t.socials() + share + '</section>' +
    '<section class="lower"><h2 class="sec-title" id="proiecte">Proiecte</h2>' + t.projects() + t.about() + t.skills() + t.xp() + t.contact() + '</section>' +
    t.foot("Bento 3 · Widget-uri") +
    '<nav class="glass dock" aria-label="Acțiuni rapide">' +
      (tel ? '<a class="main" href="tel:' + CV.esc(tel) + '">' + I.phone + 'Sună</a>' : "") +
      (wa ? '<a href="https://wa.me/' + CV.esc(wa) + '" target="_blank" rel="noopener">' + I.whatsapp + 'WhatsApp</a>' : "") +
      (p.email ? '<a href="mailto:' + CV.esc(p.email) + '">' + I.mail + 'Email</a>' : "") +
      '<button data-act="vcf">' + I.contact + 'Salvează</button></nav>';
  GLASS.wire(root, c);
});
</script>
</body>
</html>
