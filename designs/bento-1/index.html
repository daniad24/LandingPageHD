<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe9e1">
<title>Daniel Husanu – Bento 1 · Rânduri ordonate</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../glass.css">
<style>
/* 12-column desktop, 6-column phone: every row is made of tiles of equal height */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.profile { grid-column: span 6; display: flex; flex-direction: column; justify-content: center; }
.photo { grid-column: span 3; }
.now { grid-column: span 3; justify-content: space-between; }
.num { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; }
.soc { grid-column: span 3; min-height: 150px; }
.about { grid-column: span 7; }
.skills { grid-column: span 5; }
.proj { grid-column: span 6; }
.xp { grid-column: span 12; }
.xp ol { columns: 2; column-gap: 28px; }
.xp > ol > li { break-inside: avoid; }
.contact { grid-column: span 12; }
.contact .rows { grid-template-columns: repeat(3, 1fr); }
.sec-title { grid-column: 1 / -1; margin: 18px 6px 0; font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .profile { grid-column: span 6; }
  .photo { grid-column: span 3; min-height: 230px; }
  .now { grid-column: span 3; }
  .num { grid-column: span 2; min-height: 118px; padding: 16px; }
  .num strong { font-size: 38px; }
  .num span { font-size: 12px; }
  .soc { grid-column: span 3; min-height: 118px; padding: 16px; }
  .about, .skills, .proj, .xp, .contact { grid-column: span 6; }
  .xp ol { columns: 1; }
  .contact .rows { grid-template-columns: 1fr; }
  .t { padding: 18px; } :root { --r: 26px; }
  .now h3 { font-size: 16px; }
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../shared.js"></script>
<script src="../glass.js"></script>
<script>
CV.load().then(function (c) {
  var t = GLASS.tiles(c), root = document.getElementById("root");
  root.innerHTML = t.bar() + '<main class="grid">' +
    t.profile() + t.photo() + t.now() +
    t.stat(0) + t.stat(1) + t.stat(2) + t.socials() +
    t.about() + t.skills() +
    '<h2 class="sec-title" id="proiecte">Proiecte</h2>' + t.projects() +
    t.xp() + t.contact() + '</main>' + t.foot("Bento 1 · Rânduri ordonate");
  GLASS.wire(root, c);
});
</script>
</body>
</html>
