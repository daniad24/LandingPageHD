<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe9e1">
<title>Daniel Husanu – Bento 1 · Rânduri ordonate</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script>
<link rel="stylesheet" href="../glass.css">
<style>
/* 12-column desktop, 6-column phone: every row is made of tiles of equal height */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.profile { grid-column: span 6; display: flex; flex-direction: column; justify-content: center; }
.photo { grid-column: span 3; }
.now { grid-column: span 3; justify-content: space-between; }
.num { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; }
.soc { grid-column: span 3; min-height: 150px; }
.xp { grid-column: span 12; }
.xp ol { columns: 2; column-gap: 28px; }
.xp > ol > li { break-inside: avoid; }
.contact { grid-column: span 12; }
.contact .rows { grid-template-columns: repeat(3, 1fr); }

/* ---------- Despre / Competențe: one tile, two swipeable pages ---------- */
.swipe { grid-column: span 12; padding: 18px 0 20px; contain: none; }
.sw-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px 14px; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; min-width: 250px;
  background: rgba(255, 255, 255, .4); box-shadow: inset 0 1px 2px rgba(70, 40, 15, .12), inset 0 0 0 1px rgba(255, 255, 255, .5); }
.seg button { position: relative; z-index: 1; height: 38px; border: 0; background: none; cursor: pointer; font: 600 14px "Inter", sans-serif; color: var(--muted); transition: color .3s; }
.seg button.on { color: var(--text); }
.seg .ind { will-change: transform; position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px;
  background: rgba(255, 255, 255, .9); box-shadow: inset 0 1px 0 #fff, 0 4px 14px -6px rgba(70, 40, 15, .4); transform: translateX(calc(var(--p, 0) * 100%)); }
.sw-hint { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sw-hint svg { width: 16px; height: 16px; animation: nudge 2.4s var(--ease) infinite; }
@keyframes nudge { 0%, 60%, 100% { transform: none; } 30% { transform: translateX(5px); } }
.sw-track { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; touch-action: pan-x pan-y; scrollbar-width: none; overscroll-behavior-x: contain; align-items: flex-start; transition: height .4s var(--out); -webkit-overflow-scrolling: touch; }
.sw-track::-webkit-scrollbar { display: none; }
.sw-page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 0 22px; min-width: 0; }
.sw-page.about p { margin: 0 0 12px; color: var(--muted); }
.sw-page.about p:first-child { color: var(--text); font-size: 21px; line-height: 1.35; letter-spacing: -.015em; font-weight: 600; column-span: all; }
.sw-page.skills .grps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.sw-page.skills h5 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.sw-dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.sw-dots i { width: 7px; height: 7px; border-radius: 9px; background: rgba(26, 23, 20, .18); transition: width .4s var(--ease), background .3s; }
.sw-dots i.on { width: 22px; background: var(--accent); }
@media (min-width: 901px) { .sw-page.about .txt { columns: 2; column-gap: 32px; } }

/* ---------- Projects: 3D coverflow ---------- */
.cf { grid-column: span 12; padding: 22px 0 18px; overflow: hidden; }
.cf-head { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
.cf-head .label { margin: 0; }
.cf-ctrl { display: flex; align-items: center; gap: 8px; }
.cf-ctrl .count { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.cf-ctrl .count b { color: var(--text); }
.cf-ctrl .btn { width: 40px; padding: 0; }
.cf-stage { position: relative; perspective: 1400px; contain: layout; margin-top: 14px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; transition: height .4s var(--ease); }
.cf-stage:active { cursor: grabbing; }
.cf-card { position: absolute; top: 0; left: 50%; width: min(76vw, 460px); margin-left: calc(min(76vw, 460px) / -2);
  will-change: transform, opacity; backface-visibility: hidden; transition: transform .55s var(--out), opacity .4s var(--out); }
.cf-stage.dragging .cf-card { transition: none; }
.cf-card .proj { background: linear-gradient(140deg, rgba(255, 255, 255, .94), rgba(255, 255, 255, .8)); }
[data-theme="dark"] .cf-card .proj { background: linear-gradient(140deg, rgba(44, 38, 33, .97), rgba(32, 28, 24, .95)); }
[data-theme="dark"] .seg { background: rgba(255, 255, 255, .06); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .06); }
[data-theme="dark"] .seg .ind { background: rgba(255, 255, 255, .16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
[data-theme="dark"] .sw-dots i, [data-theme="dark"] .cf-dots button { background: rgba(255, 255, 255, .2); }
[data-theme="dark"] .sw-dots i.on, [data-theme="dark"] .cf-dots button.on { background: var(--accent); }
.cf-card.side .proj { box-shadow: var(--glass-shadow); }
.cf-card .proj { cursor: pointer; }
.cf-card.center .proj { box-shadow: var(--glass-shadow), 0 30px 60px -28px rgba(70, 40, 15, .55); }
.cf-card .tap { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); font-size: 12.5px; color: var(--muted); white-space: nowrap; opacity: 0; transition: opacity .3s; }
.cf-card.center .tap { opacity: 1; }
.cf-dots { display: flex; justify-content: center; gap: 6px; margin-top: 46px; }
.cf-dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 9px; cursor: pointer; background: rgba(26, 23, 20, .18); transition: width .4s var(--ease), background .3s; }
.cf-dots button.on { width: 26px; background: var(--accent); }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .profile { grid-column: span 6; }
  .photo { grid-column: span 3; min-height: 230px; }
  .now { grid-column: span 3; }
  .num { grid-column: span 2; min-height: 118px; padding: 16px; }
  .num strong { font-size: 38px; }
  .num span { font-size: 12px; }
  .soc { grid-column: span 3; min-height: 118px; padding: 16px; }
  .swipe, .cf, .xp, .contact { grid-column: span 6; }
  .xp ol { columns: 1; }
  .contact .rows { grid-template-columns: 1fr; }
  .t { padding: 18px; } :root { --r: 26px; }
  .now h3 { font-size: 16px; }
  .swipe { padding: 16px 0 18px; }
  .sw-head { padding: 0 18px 12px; } .sw-page { padding: 0 18px; }
  .seg { min-width: 0; flex: 1; }
  .sw-hint { display: none; }
  .sw-page.skills .grps { grid-template-columns: 1fr; gap: 14px; }
  .sw-page.about p:first-child { font-size: 19px; }
  .cf-head { padding: 0 18px; }
  .cf-card { width: 74vw; margin-left: -37vw; }
}
@media (prefers-reduced-motion: reduce) { .cf-card, .sw-track { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="../shared.js"></script>
<script src="../glass.js"></script>
<script>
CV.load().then(function (c) {
  var t = GLASS.tiles(c), root = document.getElementById("root"), C = CV, I = C.I, e = C.esc;
  var projects = C.list(c.projects);

  var swipe = '<section class="glass swipe" id="despre" data-in>' +
    '<div class="sw-head"><div class="seg" id="seg"><button class="on" data-pg="0">Despre</button><button data-pg="1">Competențe</button><span class="ind"></span></div>' +
    '<span class="sw-hint">Glisează ' + I.right + '</span></div>' +
    '<div class="sw-track" id="swTrack">' +
      '<div class="sw-page about"><div class="txt">' + C.paragraphs(c.about) + '</div></div>' +
      '<div class="sw-page skills"><div class="grps">' + C.list(c.skills).map(function (g) {
        return '<div><h5>' + e(g.group) + '</h5><div class="chips">' + C.list(g.items).map(function (s) { return "<span>" + e(s) + "</span>"; }).join("") + '</div></div>';
      }).join("") + '</div></div>' +
    '</div><div class="sw-dots" id="swDots"><i class="on"></i><i></i></div></section>';

  var cards = projects.map(function (_, i) {
    // the coverflow handles taps itself, so the card is not a generic [data-p] trigger
    return '<div class="cf-card" data-cf="' + i + '">' + t.project(i).replace(/ data-p="\d+"/, "").replace(" press ", " ").replace(" data-in", "") +
      '<span class="tap">Atinge pentru detalii</span></div>';
  }).join("");
  var cf = projects.length ? '<section class="glass cf" id="proiecte" data-in><div class="cf-head"><p class="label"><b></b>Proiecte</p>' +
    '<div class="cf-ctrl"><span class="count" id="cfCount"></span><button class="btn" data-cfdir="-1" aria-label="Proiectul anterior">‹</button><button class="btn" data-cfdir="1" aria-label="Proiectul următor">›</button></div></div>' +
    '<div class="cf-stage" id="cfStage">' + cards + '</div><div class="cf-dots" id="cfDots">' +
    projects.map(function (_, i) { return '<button aria-label="Proiectul ' + (i + 1) + '"></button>'; }).join("") + '</div></section>' : "";

  root.innerHTML = t.bar() + '<main class="grid">' +
    t.profile() + t.photo() + t.now() +
    t.stat(0) + t.stat(1) + t.stat(2) + t.socials() +
    swipe + cf + t.xp() + t.contact() + '</main>' + t.foot("Bento 1 · Rânduri ordonate");
  var openProject = GLASS.wire(root, c);

  /* ---------- swipe pages ---------- */
  var track = document.getElementById("swTrack"), seg = document.getElementById("seg"), pages = track.children, dots = document.getElementById("swDots").children, pg = 0;
  var settleTimer, swQueued = false;
  function heights() { return [].map.call(pages, function (x) { return x.offsetHeight; }); }
  // While a swipe is in progress the tile keeps the taller of the two pages in view,
  // so nothing gets clipped; it only shrinks/grows to the active page once the swipe has settled.
  function setHeight(px) { if (track.style.height !== px + "px") track.style.height = px + "px"; }
  function settle() {
    var f = track.scrollLeft / track.clientWidth, i = Math.round(f);
    track.scrollTop = 0;
    if (Math.abs(f - i) > .02) return; // finger still holding the page mid-way: keep both pages fully visible
    setHeight(heights()[i]);
  }
  function onSwipe() {
    swQueued = false;
    var f = Math.max(0, Math.min(pages.length - 1, track.scrollLeft / track.clientWidth));
    seg.style.setProperty("--p", f);
    var h = heights(), lo = Math.floor(f), hi = Math.ceil(f);
    setHeight(Math.max(h[lo], h[hi]));
    var now = Math.round(f);
    if (now !== pg) {
      pg = now;
      seg.querySelectorAll("button").forEach(function (b, i) { b.classList.toggle("on", i === pg); });
      [].forEach.call(dots, function (d, i) { d.classList.toggle("on", i === pg); });
    }
    clearTimeout(settleTimer); settleTimer = setTimeout(settle, 140);
  }
  track.addEventListener("scroll", function () { if (!swQueued) { swQueued = true; requestAnimationFrame(onSwipe); } }, { passive: true });
  if ("onscrollend" in window) track.addEventListener("scrollend", function () { clearTimeout(settleTimer); settle(); });
  seg.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-pg]"); if (!b) return;
    track.scrollTo({ left: +b.getAttribute("data-pg") * track.clientWidth, behavior: "smooth" });
  });
  addEventListener("resize", settle); addEventListener("load", settle); settle();

  /* ---------- coverflow ---------- */
  var stage = document.getElementById("cfStage");
  if (!stage) return;
  var items = [].slice.call(stage.children), n = items.length, cur = 0, drag = 0, loop = n >= 3;
  var cdots = [].slice.call(document.getElementById("cfDots").children), count = document.getElementById("cfCount");
  function off(i) {
    var d = i - cur;
    if (loop) { if (d > n / 2) d -= n; if (d < -n / 2) d += n; }
    return d - drag;
  }
  function render() {
    var narrow = innerWidth <= 900;
    items.forEach(function (el, i) {
      var d = off(i), a = Math.abs(d);
      var x = d * (narrow ? 64 : 58), s = 1 - Math.min(a, 2) * .14, r = -Math.max(-1.5, Math.min(1.5, d)) * 22;
      el.style.transform = "translate3d(" + x + "%, 0, " + (-a * 80) + "px) rotateY(" + r + "deg) scale(" + s + ")";
      el.style.opacity = a > 1.6 ? 0 : 1 - a * .42;
      el.style.zIndex = 100 - Math.round(a * 10);
      el.style.pointerEvents = a > 1.6 ? "none" : "auto";
      el.classList.toggle("center", a < .5);
      el.classList.toggle("side", a >= .5);
    });
    if (render.last === cur) return; render.last = cur;
    cdots.forEach(function (d, i) { d.classList.toggle("on", i === cur); });
    count.innerHTML = "<b>" + String(cur + 1).padStart(2, "0") + "</b> / " + String(n).padStart(2, "0");
    root.querySelectorAll("[data-cfdir]").forEach(function (b) { b.disabled = !loop && ((+b.getAttribute("data-cfdir") < 0 && cur === 0) || (+b.getAttribute("data-cfdir") > 0 && cur === n - 1)); });
  }
  function go(i) { cur = loop ? (i + n) % n : Math.max(0, Math.min(n - 1, i)); drag = 0; render(); }
  function fitStage() { stage.style.height = Math.max.apply(null, items.map(function (el) { return el.offsetHeight; })) + "px"; }

  var x0 = null, moved = 0, w = 1, auto, cfQueued = false;
  stage.addEventListener("pointerdown", function (ev) { x0 = ev.clientX; moved = 0; w = items[cur].offsetWidth * .6; stage.classList.add("dragging"); stopAuto(); });
  addEventListener("pointermove", function (ev) {
    if (x0 === null) return;
    var dx = ev.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    drag = -dx / w;
    if (!loop) drag = Math.max(-cur - .3, Math.min(n - 1 - cur + .3, drag));
    if (!cfQueued) { cfQueued = true; requestAnimationFrame(function () { cfQueued = false; render(); }); }
  }, { passive: true });
  function end() {
    if (x0 === null) return;
    x0 = null; stage.classList.remove("dragging");
    var step = Math.round(drag); if (step === 0 && Math.abs(drag) > .18) step = drag > 0 ? 1 : -1;
    go(cur + step);
  }
  addEventListener("pointerup", end); addEventListener("pointercancel", end);
  stage.addEventListener("click", function (ev) {
    if (moved > 6) return;
    var card = ev.target.closest("[data-cf]"); if (!card) return;
    var i = +card.getAttribute("data-cf");
    if (i === cur) openProject(i); else go(i);
  });
  root.querySelectorAll("[data-cfdir]").forEach(function (b) { b.onclick = function () { stopAuto(); go(cur + +b.getAttribute("data-cfdir")); }; });
  cdots.forEach(function (d, i) { d.onclick = function () { stopAuto(); go(i); }; });
  stage.addEventListener("keydown", function (ev) { if (ev.key === "ArrowRight") go(cur + 1); if (ev.key === "ArrowLeft") go(cur - 1); });
  stage.tabIndex = 0;

  // gentle autoplay until the visitor touches the carousel
  function stopAuto() { clearInterval(auto); auto = null; }
  if (n > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var seen = new IntersectionObserver(function (en) {
      en.forEach(function (x) {
        if (x.isIntersecting && auto === undefined) auto = setInterval(function () { if (!document.hidden) go(loop ? cur + 1 : (cur + 1) % n); }, 4500);
        if (!x.isIntersecting && auto) { clearInterval(auto); auto = undefined; }
      });
    }, { threshold: .5 });
    seen.observe(stage);
  }
  addEventListener("resize", function () { fitStage(); render(); });
  addEventListener("load", fitStage);
  stage.querySelectorAll("img").forEach(function (img) { img.addEventListener("load", fitStage); });
  render(); fitStage();
});
</script>
</body>
</html>
