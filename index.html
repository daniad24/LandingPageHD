<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daniel Husanu</title>
  <meta name="description" content="CV, proiecte și date de contact.">
  <link rel="icon" href="assets/avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="#top" class="brand" data-field="profile.name">&nbsp;</a>
      <div class="nav-links">
        <a href="#despre">Despre</a>
        <a href="#experienta">Experiență</a>
        <a href="#proiecte">Proiecte</a>
        <a href="#contact">Contact</a>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Schimbă tema">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main id="top">
    <!-- Business card -->
    <section class="hero">
      <article class="card bizcard">
        <img class="avatar" id="avatar" alt="">
        <div class="bizcard-body">
          <p class="availability" id="availability" hidden><span class="dot"></span><span></span></p>
          <h1 data-field="profile.name"></h1>
          <p class="title" data-field="profile.title"></p>
          <p class="tagline" data-field="profile.tagline"></p>
          <p class="location" id="location"></p>
          <div class="actions" id="actions"></div>
          <div class="social" id="social"></div>
        </div>
      </article>
      <div class="stats" id="stats"></div>
    </section>

    <section id="despre" class="section">
      <h2>Despre mine</h2>
      <div class="card prose" id="about"></div>
    </section>

    <section id="experienta" class="section">
      <h2>Experiență</h2>
      <ol class="timeline" id="experience"></ol>
      <h3 class="subhead">Educație</h3>
      <ol class="timeline" id="education"></ol>
    </section>

    <section id="competente" class="section">
      <h2>Competențe</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section id="proiecte" class="section">
      <h2>Proiecte</h2>
      <div class="projects" id="projects"></div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <div class="card contact-card">
        <div class="contact-list" id="contactList"></div>
        <div class="qr-wrap">
          <div id="qr" class="qr"></div>
          <p class="muted">Scanează pentru a deschide pagina</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-field="profile.name"></span>. <span data-field="footer"></span></p>
    <a href="admin/" class="muted small">Editare</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
